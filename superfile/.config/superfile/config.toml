##############################################
#                                            #
#           Superfile Configuration          #
#                                            #
##############################################

###############################################################################
#                                   Defaults                                  #
###############################################################################

editor = "nvim"
dir_editor = "nvim"

# Arch ships superfile through pacman. Let pacman own the updates.
auto_check_update = false

# The zsh `sf` wrapper reads the last directory. See zsh/.zshrc.
cd_on_quit = true

default_open_file_preview = true
show_image_preview = true
show_panel_footer_info = true
default_directory = "."
file_size_use_si = false

# 4 is natural sort. It matches the yazi setting sort_by = "natural".
default_sort_type = 4
sort_order_reversed = false
case_sensitive_sort = false

shell_close_on_success = false
page_scroll_size = 0
debug = false
ignore_missing_fields = false
file_panel_extra_columns = 0
file_panel_name_percent = 50

###############################################################################
#                                   Styling                                   #
###############################################################################

theme = "chrysaki"

# bat is already a preferred CLI tool in this setup.
code_previewer = "bat"

nerdfont = true
show_select_icons = true

# Ghostty runs opaque here. Keep the theme background.
transparent_background = false

file_preview_width = 0
enable_file_preview_border = true
sidebar_width = 20
sidebar_sections = ["home", "pinned", "disks"]

border_top = '─'
border_bottom = '─'
border_left = '│'
border_right = '│'
border_top_left = '╭'
border_top_right = '╮'
border_bottom_left = '╰'
border_bottom_right = '╯'
border_middle_left = '├'
border_middle_right = '┤'

###############################################################################
#                                   Plugins                                   #
###############################################################################

metadata = false
enable_md5_checksum = false

# zoxide already wraps cd in this shell.
zoxide_support = true

# File opening rules. This table must stay at the end of the file.
[open_with]
