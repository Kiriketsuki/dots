# filechooser replaces smart-enter on <Enter>. In chooser mode a plain "open"
# picks the file, so both open keys must go through the plugin.
[[mgr.prepend_keymap]]
on   = [ "<Enter>" ]
run  = "plugin filechooser -- --smart"
desc = "Enter the hovered directory (choose it in a folder picker), or open/choose the hovered file"

[[mgr.prepend_keymap]]
on   = [ "o" ]
run  = "plugin filechooser"
desc = "Open/choose the selected files, or the hovered one if none selected"

# Folder pickers: "leave" makes yazi hover the folder it just left, so the
# plugin then chooses the folder you were browsing.
[[mgr.prepend_keymap]]
on   = [ "<C-o>" ]
run  = [ "leave", "plugin filechooser -- --hovered" ]
desc = "Choose the current folder"

[[mgr.prepend_keymap]]
on   = [ "<C-Space>" ]
run  = "shell '~/.config/yazi/scripts/palette.sh' --block"
desc = "Command palette"
