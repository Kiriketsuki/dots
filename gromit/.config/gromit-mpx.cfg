# Gromit-MPX tool + colour configuration.
#
# ❗ Gromit-MPX only reads this at startup. After editing, apply with:
#       pkill -x gromit-mpx      # then press SUPER+A again
#
# ❗ Every definition MUST end with a semicolon. A parse error here does not
#    fall back to the system config — Gromit-MPX loads zero tools and exits.
#
# Colours accept names ("red"), hex ("#FBB13C"), or rgba() for transparency:
#       fillcolor="rgba(255, 0, 0, 0.5)"      alpha 0.0-1.0
# The hex-with-alpha form (#RRGGBBAA) is NOT supported.
#
# Full syntax reference:
#   https://github.com/bk138/gromit-mpx/blob/master/README.md#configuration


#
# Palette — Chrysaki light/bright variants, chosen to stay legible over both
# dark terminals and bright browser pages during a screen share.
#
"pen blonde"  = PEN (size=5 color="#FBB13C");
"pen teal"    = PEN (size=5 color="#20969C");
"pen emerald" = PEN (size=5 color="#1A8A6A");
"pen error"   = PEN (size=5 color="#B53F4A");

"marker blonde" = PEN (size=14 color="rgba(251, 177, 60, 0.4)");

"arrow blonde" = PEN (size=6 color="#FBB13C" arrowsize=1);

"rect error"   = RECT (color="#B53F4A" size=4);
"circle teal"  = CIRCLE (color="#20969C" size=4);
"line emerald" = LINE (color="#1A8A6A" size=4);

"eraser" = ERASER (size=75);


#
# Which tool each mouse button + modifier draws with.
# Left-drag with no modifier is the everyday pen.
#
"default"              = "pen blonde";
"default"[SHIFT]       = "pen teal";
"default"[CONTROL]     = "pen error";
"default"[ALT]         = "rect error";
"default"[ALT,SHIFT]   = "circle teal";
"default"[ALT,CONTROL] = "line emerald";
"default"[2]           = "arrow blonde";
"default"[Button3]     = "eraser";


#
# Hot keys are left unset on purpose: Gromit-MPX grabs these via X11, which is
# unreliable under XWayland on Hyprland. All keys are handled by the Hyprland
# "annotate" submap in hyprland.conf instead.
#
# HOTKEY = "F9";
# UNDOKEY = "F8";
