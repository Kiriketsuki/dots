<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Remap generic "Iosevka Nerd Font" requests to our installed variant -->
  <match target="pattern">
    <test qual="any" name="family"><string>Iosevka Nerd Font</string></test>
    <edit name="family" mode="assign" binding="same"><string>IosevkaTermSlab Nerd Font</string></edit>
  </match>

  <!-- Make IosevkaTermSlab the system default monospace font -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>IosevkaTermSlab Nerd Font</string>
    </edit>
  </match>

  <!-- Explicit Iosevka alias: JetBrains as fallback, then CJK and emoji -->
  <alias>
    <family>IosevkaTermSlab Nerd Font</family>
    <prefer>
      <family>IosevkaTermSlab Nerd Font</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

</fontconfig>
