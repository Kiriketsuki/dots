<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Make Red Hat Mono the system default monospace; Blex supplies glyphs Red Hat Mono lacks -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Red Hat Mono</string>
    </edit>
  </match>

  <!-- Red Hat Mono fallback chain: Blex Nerd glyphs, then CJK and emoji -->
  <alias>
    <family>Red Hat Mono</family>
    <prefer>
      <family>Red Hat Mono</family>
      <family>BlexMono Nerd Font</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK KR</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Remap legacy Iosevka/Symbols Nerd Font requests to Blex so old refs still get glyphs -->
  <match target="pattern">
    <test qual="any" name="family"><string>Iosevka Nerd Font</string></test>
    <edit name="family" mode="assign" binding="same"><string>BlexMono Nerd Font</string></edit>
  </match>

</fontconfig>
