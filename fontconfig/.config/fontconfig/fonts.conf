<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>Iosevka Nerd Font</string></test>
    <edit name="family" mode="assign" binding="same"><string>IosevkaTermSlab Nerd Font</string></edit>
  </match>

  <alias>
    <family>IosevkaTermSlab Nerd Font</family>
    <prefer>
      <family>IosevkaTermSlab Nerd Font</family>
      <family>Noto Sans Mono CJK SC</family> <family>Noto Sans Mono CJK JP</family> <family>Noto Sans Mono CJK KR</family> <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
