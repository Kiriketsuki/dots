# ttypicker: XDG FileChooser portal backend that runs yazi in a terminal.
# The "File Picker" title matches the float rule in hypr/hyprland.lua.
# See https://github.com/olibrks/ttypicker/blob/main/doc/configuration.md
[FileChooser]
term='ghostty --title="File Picker" -e'
exec="/home/kiriketsuki/.config/yazi/scripts/chooser.sh {OUT_PATH} {IN_PATH}"
in_path="{SUGGESTED_PATH}"
default_dir="/home/kiriketsuki/Downloads"

# Open dialogs start in the folder this app used last time.
[FileChooser.OpenFile]
in_path="{APP_LAST_PATH}"
