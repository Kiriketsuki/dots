# hyprlock, Night Glass. It matches the Quickshell bar and the SDDM theme.
# The colours come from quickshell/.config/quickshell/Theme.qml.
# wallpaper.sh points .current_lock at a random wallpaper, aerie renders included.

general {
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/backgrounds/.current_lock
    color = rgba(10, 18, 48, 1.0)
    blur_passes = 2
    blur_size = 5
    brightness = 0.65
}

# Clock and date, left.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(246, 241, 233, 1.0)
    font_size = 110
    font_family = Space Mono
    position = 170, 80
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B" | tr '[:lower:]' '[:upper:]'
    color = rgba(159, 208, 240, 1.0)
    font_size = 20
    font_family = Space Mono
    position = 176, -40
    halign = left
    valign = center
}

# The glass pane, right of centre. Every item below centres on x = 420.
shape {
    monitor =
    size = 420, 330
    color = rgba(14, 20, 44, 0.8)
    rounding = 0
    border_size = 1
    border_color = rgba(163, 131, 227, 0.35)
    # The pane draws first, under the mark, the labels and the input field.
    zindex = 0
    position = 420, -10
    halign = center
    valign = center
}

image {
    monitor =
    path = $HOME/.config/hypr/assets/dots-icon.png
    zindex = 1
    size = 88
    rounding = 0
    border_size = 0
    position = 420, 85
    halign = center
    valign = center
}

label {
    monitor =
    text = LOCKED
    zindex = 1
    color = rgba(159, 208, 240, 1.0)
    font_size = 12
    font_family = Space Mono
    position = 420, 18
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "$USER" | tr '[:lower:]' '[:upper:]'
    zindex = 1
    color = rgba(163, 131, 227, 1.0)
    font_size = 10
    font_family = Space Mono
    position = 420, -8
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 46
    zindex = 1
    outline_thickness = 1
    rounding = 0
    inner_color = rgba(14, 20, 44, 0.6)
    outer_color = rgba(159, 208, 240, 0.35)
    check_color = rgba(32, 150, 156, 1.0)
    fail_color = rgba(242, 154, 162, 1.0)
    font_color = rgba(246, 241, 233, 1.0)
    font_family = Space Grotesk
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    placeholder_text = Password
    fail_text = Wrong password. Try again.
    position = 420, -70
    halign = center
    valign = center
}
