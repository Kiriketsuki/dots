%YAML 1.3
---
- MouseGesture: Mouse Left
- Execute: [hyprctl, dispatch, workspace, m-1]
...
---
- MouseGesture: Mouse Right
- Execute: [hyprctl, dispatch, workspace, m+1]
...
---
- MouseGesture: Mouse Up
- Execute: [hyprctl, dispatch, fullscreen, '1']
...
---
- MouseGesture: Mouse Down
- Execute: [rofi, -show, run]
...
---
- MouseGesture: []
- Execute: [rofi, -show, window]
...
---
- Key: [Haptic, pressed]
- Set: [null, haptic-play, SHARP STATE CHANGE]
- Execute: [hyprctl, dispatch, global, 'menu.kando.Kando:chrysaki']
...
