<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <title>dots</title>
  <defs>
    <radialGradient id="sky" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#172641"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#03111e"/>
    </radialGradient>
    <radialGradient id="dusk" cx="1" cy="1" r="0.9">
      <stop offset="0" stop-color="#583090" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#583090" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a383e3"/>
      <stop offset="1" stop-color="#6fd3d6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fbb13c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fbb13c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night sky tile, with an amethyst dusk in the lower right. -->
  <rect width="64" height="64" rx="12" fill="url(#sky)"/>
  <rect width="64" height="64" rx="12" fill="url(#dusk)"/>

  <!-- An orbit ring, the bar's workspace motif. -->
  <circle cx="32" cy="34" r="24" fill="none" stroke="#6fd3d6" stroke-opacity="0.16" stroke-width="0.6"/>

  <!-- Faint background stars. -->
  <g fill="#d8ebfb">
    <circle cx="9" cy="9" r="0.5" opacity="0.6"/>
    <circle cx="55" cy="8" r="0.45" opacity="0.5"/>
    <circle cx="8" cy="40" r="0.4" opacity="0.45"/>
    <circle cx="57" cy="31" r="0.5" opacity="0.55"/>
    <circle cx="16" cy="54" r="0.4" opacity="0.4"/>
    <circle cx="47" cy="55" r="0.45" opacity="0.5"/>
    <circle cx="22" cy="31" r="0.35" opacity="0.4"/>
    <circle cx="44" cy="40" r="0.35" opacity="0.4"/>
  </g>

  <!-- The Tetsuhiro T as a constellation: a bowed crossbar and a tapering stem. -->
  <path d="M12 20.5 L22 18 L32 17.5 L42 18 L52 20.5 M32 17.5 L31 29 L32.5 40.5 L31.5 52"
        fill="none" stroke="url(#line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <circle cx="31.5" cy="52" r="6" fill="url(#glow)"/>
  <g fill="#f6f1e9">
    <circle cx="12" cy="20.5" r="1.6"/>
    <circle cx="22" cy="18" r="1.9"/>
    <circle cx="32" cy="17.5" r="2.6"/>
    <circle cx="42" cy="18" r="1.9"/>
    <circle cx="52" cy="20.5" r="1.6"/>
    <circle cx="31" cy="29" r="1.8"/>
    <circle cx="32.5" cy="40.5" r="1.5"/>
  </g>
  <circle cx="31.5" cy="52" r="1.9" fill="#fbb13c"/>
</svg>
