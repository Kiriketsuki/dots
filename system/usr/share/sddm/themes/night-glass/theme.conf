[General]
# Clock format, in Qt date format.
clockFormat=HH:mm
# Quote a value with a comma. SDDM reads an unquoted comma as a list.
dateFormat="dddd, d MMMM"
# Background image, relative to this folder.
background=background.jpg
# User name in the user field when SDDM has no last user.
defaultUser=kiriketsuki
