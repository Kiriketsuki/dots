#? Config file for btop — managed by dots/btop stow package

#* Theme: Chrysaki palette (generated by btop/scripts/update_colors.py)
color_theme = "chrysaki"

#* Show themed background
theme_background = true

#* 24-bit truecolor
truecolor = true

#* Graph rendering
graph_symbol = "braille"

#* Boxes to show
shown_boxes = "cpu mem net proc"

#* Update interval (ms)
update_ms = 2000

#* Process sorting — "cpu lazy" follows top process over time
proc_sorting = "cpu lazy"
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true
proc_cpu_graphs = true

#* CPU
cpu_invert_lower = true
show_uptime = true
show_cpu_freq = true
check_temp = true
show_coretemp = true
temp_scale = "celsius"

#* Memory / Disks
mem_graphs = true
show_swap = true
show_disks = true
only_physical = true
show_io_stat = true

#* Network
net_auto = true
net_sync = true

#* Battery
show_battery = true

#* Rounded box corners
rounded_corners = true

#* Clock format in top bar
clock_format = "%X"

#* Do not auto-save — stow manages this file
save_config_on_exit = false

#* Log level
log_level = "WARNING"
